<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#11182b"><title>かんたん勇者RPG</title><style>*{box-sizing:border-box}body{margin:0;background:#0d1222;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}.app{max-width:680px;margin:auto;padding:14px}h1{text-align:center;font-size:25px}.sub{text-align:center;color:#aeb8d8;font-size:13px}.card{background:#1a2239;border:1px solid #34405f;border-radius:18px;padding:14px;margin:12px 0}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.box{background:#252f4c;border-radius:12px;padding:10px}.label,small{color:#b9c2df;font-size:12px}.bar{height:13px;background:#080c16;border-radius:20px;overflow:hidden;margin-top:5px}.fill{height:100%;background:#68dfa2}.exp{background:#72a9ff}.enemy{display:flex;gap:14px;align-items:center}.icon{font-size:56px;width:92px;height:92px;display:grid;place-items:center;background:#252f4c;border-radius:22px}.enemyInfo{flex:1}.enemyInfo h2{margin:0 0 5px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}button{border:0;border-radius:13px;padding:13px 8px;font-weight:700;color:#fff;background:#354264;font-size:15px}.primary{background:#4269e1}.green{background:#26845f}.gold{background:#a77c1e}.red{background:#b8424d}.areas{display:flex;gap:7px;overflow:auto}.areas button{white-space:nowrap}.active{outline:2px solid #9d7aff}.log{height:145px;overflow:auto;background:#0a0f1d;border-radius:12px;padding:10px;line-height:1.55;font-size:14px}.shop{display:flex;justify-content:space-between;align-items:center;background:#252f4c;border-radius:12px;padding:9px;margin-top:7px}.shop button{padding:9px}.good{color:#6ee5aa}.bad{color:#ff9da5}.money{color:#ffd45d}footer{text-align:center;color:#7885aa;font-size:11px}</style></head><body><main class="app"><h1>⚔️ かんたん勇者RPG</h1><div class="sub">倒す → 稼ぐ → 買う → どんどん強くなる</div><section class="card"><div class="stats"><div class="box"><div class="label">レベル</div><b id="lv"></b></div><div class="box"><div class="label">ゴールド</div><b><span id="gold"></span> G</b></div><div class="box"><div class="label">攻撃力</div><b id="atk"></b></div><div class="box"><div class="label">装備</div><b id="weapon"></b></div></div><p>HP <b id="hpText"></b></p><div class="bar"><div id="hpBar" class="fill"></div></div><p>EXP <b id="expText"></b></p><div class="bar"><div id="expBar" class="fill exp"></div></div></section><section class="card"><b>🗺️ 冒険エリア</b><div id="areas" class="areas" style="margin-top:10px"></div></section><section class="card"><div class="enemy"><div id="icon" class="icon"></div><div class="enemyInfo"><h2 id="ename"></h2><small>HP <span id="ehp"></span></small><div class="bar"><div id="ehpBar" class="fill"></div></div><small>EXP <span id="eexp"></span> / <span id="egold"></span> G</small></div></div><div class="buttons"><button id="attack" class="primary">⚔️ たたかう</button><button id="herb" class="green">🌿 やくそう</button><button id="next" class="gold">🔄 次の敵</button><button id="boss" class="red">👑 ボス戦</button></div></section><section class="card"><b>📜 バトルログ</b><div id="log" class="log" style="margin-top:9px"></div></section><section class="card"><b>🛒 武器屋</b><div id="shop"></div></section><section class="card"><b>🏨 宿屋・セーブ</b><div class="buttons"><button id="inn" class="green">🏨 宿屋 20G</button><button id="save">💾 セーブ</button><button id="load">📂 ロード</button><button id="reset" class="red">🗑️ 最初から</button></div></section><footer>Version 1.0 — かんたん勇者RPG</footer></main><script>(()=>{const K='simple_yusha_rpg_v1';const W=[['木の剣',0,0],['銅の剣',5,80],['鉄の剣',12,220],['炎の剣',24,600],['雷鳴の剣',40,1400],['勇者の剣',70,3500],['伝説の剣',120,9000]];const A=[{n:'はじまりの草原',e:[['スライム','💧',18,2,12,12],['おおねずみ','🐀',24,3,15,15],['ゴブリン','👺',32,4,20,22]],b:['ゴブリンキング','👑',95,8,90,130]},{n:'くらやみの森',e:[['どくキノコ','🍄',50,7,34,38],['オオカミ','🐺',62,9,42,48],['オーク','👹',78,11,52,60]],b:['森の魔獣','🦁',220,17,230,330]},{n:'灼熱の洞窟',e:[['火炎トカゲ','🦎',105,15,75,85],['サラマンダー','🔥',128,18,90,105],['炎の騎士','🛡️',155,22,110,125]],b:['レッドドラゴン','🐉',440,30,500,800]},{n:'魔王城',e:[['ダークナイト','⚫',220,30,160,180],['デーモン','😈',270,35,190,220],['ドラゴン','🐲',340,42,240,300]],b:['魔王','🧛',1000,58,1800,5000]}];let s={lv:1,xp:0,g:0,hp:40,max:40,base:6,w:0,area:0,open:1,herb:3,wins:0,boss:[0,0,0,0],enemy:null};const $=x=>document.getElementById(x),need=()=>30+(s.lv-1)*22,patk=()=>s.base+W[s.w][1],rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;function msg(t,c=''){let d=document.createElement('div');d.className=c;d.innerHTML=t;$('log').prepend(d)}function make(a,b=false){let q=b?A[a].b:A[a].e[rnd(0,A[a].e.length-1)],boost=Math.max(0,s.lv-(a*5+1))*.02,h=Math.round(q[2]*(1+boost));return{n:q[0],i:q[1],hp:h,max:h,atk:Math.round(q[3]*(1+boost*.7)),xp:q[4],g:q[5],boss:b}}function spawn(){s.enemy=make(s.area);render()}function level(){while(s.xp>=need()){s.xp-=need();s.lv++;let h=12+Math.floor(s.lv*1.5),a=3+Math.floor(s.lv/3);s.max+=h;s.base+=a;s.hp=s.max;msg(`🎉 <b>レベル${s.lv}！</b> HP+${h} / 攻撃+${a}！`,'good')}}function win(){let e=s.enemy;s.xp+=e.xp;s.g+=e.g;s.wins++;msg(`✅ ${e.n}を倒した！ <b>${e.xp} EXP / ${e.g}G</b>`,'money');if(e.boss){s.boss[s.area]=1;if(s.area<3){s.open=Math.max(s.open,s.area+2);msg(`🚪 <b>${A[s.area+1].n}</b> が開放された！`,'good')}else msg('🏆 <b>魔王を倒した！ ゲームクリア！</b>','good')}if(s.wins%5===0){s.herb++;msg('🌿 5勝ボーナス！ やくそう+1','good')}level();spawn();save()}function attack(){let e=s.enemy,crit=Math.random()<.12,d=rnd(Math.floor(patk()*.85),Math.ceil(patk()*1.15));if(crit)d=Math.round(d*1.8);e.hp=Math.max(0,e.hp-d);msg(`⚔️ ${crit?'<b>会心！</b> ':''}${e.n}に ${d} ダメージ`);if(!e.hp)return win();if(Math.random()<.08)msg('💨 攻撃をかわした！','good');else{let d2=rnd(Math.max(1,Math.floor(e.atk*.8)),Math.ceil(e.atk*1.2));s.hp=Math.max(0,s.hp-d2);msg(`💥 ${e.n}から ${d2} ダメージ`,'bad')}if(!s.hp){let loss=Math.floor(s.g*.15);s.g-=loss;s.hp=s.max;msg(`💀 倒れた…町で復活！ ${loss}G失った`,'bad');spawn()}render();save()}function herb(){if(!s.herb||s.hp===s.max)return;s.herb--;let old=s.hp;s.hp=Math.min(s.max,s.hp+Math.round(s.max*.55));msg(`🌿 HPが ${s.hp-old} 回復！`,'good');render();save()}function save(){localStorage.setItem(K,JSON.stringify(s))}function load(){try{let x=JSON.parse(localStorage.getItem(K));if(x)s={...s,...x};if(!s.enemy)spawn();render()}catch(e){}}function render(){ $('lv').textContent=s.lv;$('gold').textContent=s.g;$('atk').textContent=patk();$('weapon').textContent=W[s.w][0];$('hpText').textContent=`${s.hp} / ${s.max}`;$('hpBar').style.width=s.hp/s.max*100+'%';$('expText').textContent=`${s.xp} / ${need()}`;$('expBar').style.width=s.xp/need()*100+'%';let e=s.enemy;if(e){$('icon').textContent=e.i;$('ename').textContent=(e.boss?'👑 ':'')+e.n;$('ehp').textContent=`${e.hp} / ${e.max}`;$('ehpBar').style.width=e.hp/e.max*100+'%';$('eexp').textContent=e.xp;$('egold').textContent=e.g}$('herb').textContent=`🌿 やくそう ×${s.herb}`;$('boss').textContent=s.boss[s.area]?'👑 ボス再戦':'👑 ボス戦';$('areas').innerHTML='';A.forEach((a,i)=>{let b=document.createElement('button');b.textContent=(i<s.open?'':'🔒 ')+a.n;b.disabled=i>=s.open;if(i===s.area)b.className='active';b.onclick=()=>{s.area=i;spawn();msg(`🗺️ ${a.n}へ移動した`);save()};$('areas').appendChild(b)});$('shop').innerHTML='';W.slice(1).forEach((w,j)=>{let i=j+1,d=document.createElement('div');d.className='shop';d.innerHTML=`<span><b>🗡️ ${w[0]}</b><br><small>攻撃 +${w[1]} / ${w[2]}G</small></span>`;let b=document.createElement('button');b.textContent=i<=s.w?'所持済み':w[2]+'G';b.disabled=i<=s.w;b.onclick=()=>{if(s.g<w[2])return;s.g-=w[2];s.w=i;msg(`🗡️ ${w[0]}を装備！`,'good');render();save()};d.appendChild(b);$('shop').appendChild(d)})}$('attack').onclick=attack;$('herb').onclick=herb;$('next').onclick=()=>{spawn();msg('🔄 別の敵を探した')};$('boss').onclick=()=>{s.enemy=make(s.area,true);msg(`👑 ${s.enemy.n}が現れた！`,'bad');render()};$('inn').onclick=()=>{if(s.g<20||s.hp===s.max)return;s.g-=20;s.hp=s.max;msg('🏨 HP全回復！','good');render();save()};$('save').onclick=()=>{save();msg('💾 セーブしました','good')};$('load').onclick=()=>{load();msg('📂 ロードしました','good')};$('reset').onclick=()=>{if(confirm('最初からやり直しますか？')){localStorage.removeItem(K);location.reload()}};if(localStorage.getItem(K))load();else{spawn();msg('🌟 冒険が始まった！ 敵を倒して強くなろう！','good');save()}render()})();</script></body></html>
