<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#101722">
<title>かんたん勇者RPG 3D</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#101722;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;overscroll-behavior:none}
body{min-height:100vh}
#app{max-width:760px;margin:auto;padding:10px}
#hud{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:8px}
.hudbox{background:#1c2637;border:1px solid #34445f;border-radius:12px;padding:8px;text-align:center;min-width:0}
.hudbox small{display:block;color:#aebbd0;font-size:11px}.hudbox b{font-size:15px}
#gameWrap{position:relative;border-radius:18px;overflow:hidden;background:#000;border:1px solid #34445f;aspect-ratio:9/13;max-height:720px;touch-action:none;-webkit-user-select:none;user-select:none}
#game{width:100%;height:100%;display:block;touch-action:none}
#topMsg{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:rgba(7,11,18,.72);border:1px solid rgba(255,255,255,.18);border-radius:20px;padding:7px 12px;font-size:13px;white-space:nowrap;pointer-events:none}
#enemyBar{position:absolute;left:50%;top:52px;transform:translateX(-50%);width:62%;display:none;pointer-events:none}.ename{text-align:center;font-size:12px;text-shadow:0 1px 2px #000}.bar{height:9px;background:rgba(0,0,0,.55);border-radius:10px;overflow:hidden;border:1px solid rgba(255,255,255,.18)}.fill{height:100%;background:#77e39e}
#joystick{position:absolute;left:18px;bottom:22px;width:112px;height:112px;border-radius:50%;background:rgba(255,255,255,.13);border:2px solid rgba(255,255,255,.24);touch-action:none}
#stick{position:absolute;left:34px;top:34px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.65);box-shadow:0 2px 12px rgba(0,0,0,.3)}
#attackBtn{position:absolute;right:22px;bottom:30px;width:90px;height:90px;border-radius:50%;border:0;background:#d34852;color:white;font-weight:900;font-size:18px;box-shadow:0 5px 15px rgba(0,0,0,.35);touch-action:manipulation}
#healBtn{position:absolute;right:34px;bottom:132px;width:66px;height:54px;border-radius:18px;border:0;background:#2b8c68;color:#fff;font-weight:800;font-size:13px;touch-action:manipulation}
#flash{position:absolute;inset:0;pointer-events:none;background:rgba(255,255,255,0);transition:background .08s}
#floatLayer{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.float{position:absolute;left:50%;top:42%;transform:translate(-50%,0);font-weight:900;font-size:24px;text-shadow:0 2px 4px #000;animation:pop .8s ease-out forwards}.reward{color:#ffd65f;font-size:17px;top:48%}
@keyframes pop{0%{opacity:0;transform:translate(-50%,12px) scale(.7)}25%{opacity:1;transform:translate(-50%,0) scale(1.15)}100%{opacity:0;transform:translate(-50%,-46px) scale(1)}}
#panel{margin-top:9px;background:#1c2637;border:1px solid #34445f;border-radius:16px;padding:10px}
#expRow{display:flex;align-items:center;gap:8px;font-size:13px}.expbar{flex:1;height:10px;background:#0d1420;border-radius:10px;overflow:hidden}.expfill{height:100%;background:#70a7ff}
#tips{color:#aebbd0;font-size:12px;line-height:1.5;margin-top:7px}
#reset{margin-top:8px;width:100%;border:0;border-radius:11px;padding:11px;background:#37465f;color:white;font-weight:700}
@media (max-width:420px){#app{padding:6px}#hud{gap:4px}.hudbox{padding:6px 3px}.hudbox b{font-size:13px}#joystick{width:102px;height:102px;left:14px;bottom:18px}#stick{left:30px;top:30px}#attackBtn{width:82px;height:82px;right:18px;bottom:24px}#healBtn{right:26px;bottom:118px}}
</style>
</head>
<body>
<main id="app">
  <div id="hud">
    <div class="hudbox"><small>LV</small><b id="lv">1</b></div>
    <div class="hudbox"><small>HP</small><b id="hp">40/40</b></div>
    <div class="hudbox"><small>ATK</small><b id="atk">8</b></div>
    <div class="hudbox"><small>GOLD</small><b id="gold">0G</b></div>
  </div>
  <section id="gameWrap">
    <canvas id="game"></canvas>
    <div id="topMsg">草原を走って敵を倒そう！</div>
    <div id="enemyBar"><div class="ename" id="enemyName">スライム</div><div class="bar"><div id="enemyFill" class="fill"></div></div></div>
    <div id="flash"></div><div id="floatLayer"></div>
    <div id="joystick"><div id="stick"></div></div>
    <button id="healBtn" type="button">🌿 回復<br><span id="herbs">3</span></button>
    <button id="attackBtn" type="button">⚔️ 攻撃</button>
  </section>
  <section id="panel">
    <div id="expRow"><span>EXP</span><div class="expbar"><div id="expFill" class="expfill"></div></div><span id="expText">0/30</span></div>
    <div id="tips">左下を指で動かして移動、右下の「攻撃」で斬る。敵を倒すと経験値とお金がすぐ貯まります。画面の拡大・ダブルタップズームはゲーム中に起きにくい設定にしてあります。</div>
    <button id="reset" type="button">最初からやり直す</button>
  </section>
</main>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

const SAVE='kantan_yusha_3d_v1';
const gameWrap=document.getElementById('gameWrap');
const canvas=document.getElementById('game');
const lvEl=document.getElementById('lv'),hpEl=document.getElementById('hp'),atkEl=document.getElementById('atk'),goldEl=document.getElementById('gold');
const expFill=document.getElementById('expFill'),expText=document.getElementById('expText');
const herbsEl=document.getElementById('herbs'),enemyBar=document.getElementById('enemyBar'),enemyFill=document.getElementById('enemyFill'),enemyName=document.getElementById('enemyName');
const topMsg=document.getElementById('topMsg'),floatLayer=document.getElementById('floatLayer'),flash=document.getElementById('flash');

let state={lv:1,xp:0,gold:0,hp:40,maxHp:40,atk:8,herbs:3,kills:0};
try{const s=JSON.parse(localStorage.getItem(SAVE));if(s)state={...state,...s}}catch(e){}
const needXp=()=>30+(state.lv-1)*22;
const save=()=>localStorage.setItem(SAVE,JSON.stringify(state));
function levelCheck(){
  while(state.xp>=needXp()){
    state.xp-=needXp();state.lv++;state.maxHp+=12+Math.floor(state.lv*1.5);state.atk+=3+Math.floor(state.lv/3);state.hp=state.maxHp;
    toast(`🎉 LEVEL ${state.lv}! 攻撃力アップ！`);
  }
}
function updateHud(){lvEl.textContent=state.lv;hpEl.textContent=`${state.hp}/${state.maxHp}`;atkEl.textContent=state.atk;goldEl.textContent=`${state.gold}G`;herbsEl.textContent=state.herbs;expText.textContent=`${state.xp}/${needXp()}`;expFill.style.width=`${Math.min(100,state.xp/needXp()*100)}%`}
function toast(t){topMsg.textContent=t;clearTimeout(toast.t);toast.t=setTimeout(()=>topMsg.textContent='草原を走って敵を倒そう！',1800)}
function floatText(t,cls=''){const d=document.createElement('div');d.className=`float ${cls}`;d.textContent=t;floatLayer.appendChild(d);setTimeout(()=>d.remove(),900)}

const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x8bc7e8);scene.fog=new THREE.Fog(0x8bc7e8,22,48);
const camera=new THREE.PerspectiveCamera(55,1,.1,100);
scene.add(new THREE.HemisphereLight(0xdff4ff,0x4c6b36,2.0));
const sun=new THREE.DirectionalLight(0xffffff,2.1);sun.position.set(8,14,6);sun.castShadow=true;scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(70,70),new THREE.MeshLambertMaterial({color:0x6aa94f}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const grid=new THREE.GridHelper(70,35,0x5b8f48,0x5b8f48);grid.position.y=.015;scene.add(grid);

function mat(c){return new THREE.MeshStandardMaterial({color:c,roughness:.8})}
const player=new THREE.Group();
const body=new THREE.Mesh(new THREE.CapsuleGeometry(.45,.9,5,8),mat(0x3267d6));body.position.y=1.05;body.castShadow=true;player.add(body);
const head=new THREE.Mesh(new THREE.SphereGeometry(.34,16,12),mat(0xf0c59e));head.position.y=1.88;head.castShadow=true;player.add(head);
const swordPivot=new THREE.Group();swordPivot.position.set(.48,1.12,0);player.add(swordPivot);
const blade=new THREE.Mesh(new THREE.BoxGeometry(.10,.10,1.15),new THREE.MeshStandardMaterial({color:0xe9eef5,metalness:.6,roughness:.25}));blade.position.z=-.58;blade.castShadow=true;swordPivot.add(blade);
const hilt=new THREE.Mesh(new THREE.BoxGeometry(.5,.12,.12),mat(0x7b4a20));hilt.position.z=-.08;swordPivot.add(hilt);
scene.add(player);

for(let i=0;i<26;i++){
  const g=new THREE.Group();const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.16,.23,1.2,7),mat(0x76502b));trunk.position.y=.6;g.add(trunk);
  const crown=new THREE.Mesh(new THREE.ConeGeometry(.8,1.8,9),mat(0x2f7e3b));crown.position.y=1.75;g.add(crown);
  const a=Math.random()*Math.PI*2,r=18+Math.random()*14;g.position.set(Math.cos(a)*r,0,Math.sin(a)*r);scene.add(g);
}

const enemies=[];
function makeEnemy(){
  const level=Math.max(1,state.lv+Math.floor(Math.random()*2)-1);const maxHp=18+level*7;const g=new THREE.Group();
  const slime=new THREE.Mesh(new THREE.SphereGeometry(.65,18,12),mat(0x42b7ff));slime.scale.y=.72;slime.position.y=.55;slime.castShadow=true;g.add(slime);
  const eyeMat=mat(0x111111);for(const x of [-.22,.22]){const e=new THREE.Mesh(new THREE.SphereGeometry(.055,8,6),eyeMat);e.position.set(x,.68,-.54);g.add(e)}
  let p;do{p=new THREE.Vector3((Math.random()-.5)*34,0,(Math.random()-.5)*34)}while(p.length()<5);g.position.copy(p);scene.add(g);
  enemies.push({group:g,hp:maxHp,maxHp,atk:2+level*1.4,xp:10+level*3,gold:10+level*4,speed:.55+Math.random()*.2,hitCd:0});
}
for(let i=0;i<9;i++)makeEnemy();

let joy={x:0,y:0},joyId=null;
const joystick=document.getElementById('joystick'),stick=document.getElementById('stick');
function setJoy(e){const r=joystick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const max=r.width*.32,len=Math.hypot(dx,dy)||1;if(len>max){dx=dx/len*max;dy=dy/len*max}joy.x=dx/max;joy.y=dy/max;stick.style.transform=`translate(${dx}px,${dy}px)`}
joystick.addEventListener('pointerdown',e=>{joyId=e.pointerId;joystick.setPointerCapture(e.pointerId);setJoy(e)});
joystick.addEventListener('pointermove',e=>{if(e.pointerId===joyId)setJoy(e)});
function endJoy(e){if(e.pointerId!==joyId)return;joyId=null;joy.x=joy.y=0;stick.style.transform='translate(0,0)'}
joystick.addEventListener('pointerup',endJoy);joystick.addEventListener('pointercancel',endJoy);

let attacking=false,attackTime=0,attackCooldown=0;
document.getElementById('attackBtn').addEventListener('pointerdown',()=>{
  if(attackCooldown>0)return;attacking=true;attackTime=.24;attackCooldown=.36;
  flash.style.background='rgba(255,255,255,.12)';setTimeout(()=>flash.style.background='rgba(255,255,255,0)',70);
  const forward=new THREE.Vector3(0,0,-1).applyQuaternion(player.quaternion);
  let hit=null,best=2.25;
  for(const e of enemies){const to=e.group.position.clone().sub(player.position),d=to.length();if(d<best&&forward.dot(to.normalize())>.25){hit=e;best=d}}
  if(hit){const dmg=Math.max(1,Math.round(state.atk*(.85+Math.random()*.35)*(Math.random()<.14?1.8:1)));hit.hp-=dmg;floatText(`${dmg} DAMAGE!`);hit.group.scale.set(1.25,.75,1.25);setTimeout(()=>hit.group.scale.set(1,1,1),90);if(hit.hp<=0)defeat(hit)}
});
function defeat(e){scene.remove(e.group);const i=enemies.indexOf(e);if(i>=0)enemies.splice(i,1);state.xp+=e.xp;state.gold+=e.gold;state.kills++;if(state.kills%5===0)state.herbs++;floatText(`+${e.xp} EXP  +${e.gold}G`,'reward');levelCheck();updateHud();save();setTimeout(makeEnemy,450)}

document.getElementById('healBtn').addEventListener('pointerdown',()=>{if(state.herbs<=0||state.hp>=state.maxHp)return;state.herbs--;state.hp=Math.min(state.maxHp,state.hp+Math.round(state.maxHp*.55));toast('🌿 HP回復！');updateHud();save()});
document.getElementById('reset').addEventListener('click',()=>{if(confirm('最初からやり直しますか？')){localStorage.removeItem(SAVE);location.reload()}});

function resize(){const r=gameWrap.getBoundingClientRect();renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

let last=performance.now();
function loop(now){requestAnimationFrame(loop);let dt=Math.min(.033,(now-last)/1000);last=now;attackCooldown=Math.max(0,attackCooldown-dt);
  const input=new THREE.Vector3(joy.x,0,joy.y);if(input.lengthSq()>.01){input.normalize();const speed=6.4;player.position.x+=input.x*speed*dt;player.position.z+=input.z*speed*dt;player.position.x=THREE.MathUtils.clamp(player.position.x,-30,30);player.position.z=THREE.MathUtils.clamp(player.position.z,-30,30);const ang=Math.atan2(-input.x,-input.z);player.rotation.y=THREE.MathUtils.lerp(player.rotation.y,ang,.22)}
  if(attacking){attackTime-=dt;const t=Math.max(0,attackTime/.24);swordPivot.rotation.x=-1.8+Math.sin((1-t)*Math.PI)*2.4;if(attackTime<=0){attacking=false;swordPivot.rotation.x=0}}
  let nearest=null,nearD=999;
  for(const e of [...enemies]){e.hitCd=Math.max(0,e.hitCd-dt);const to=player.position.clone().sub(e.group.position);const d=to.length();if(d<nearD){nearD=d;nearest=e}if(d<11){to.normalize();e.group.position.addScaledVector(to,e.speed*dt);e.group.lookAt(player.position.x,e.group.position.y,player.position.z)}if(d<1.15&&e.hitCd<=0){e.hitCd=.85;const dmg=Math.max(1,Math.round(e.atk*(.8+Math.random()*.4)));state.hp=Math.max(0,state.hp-dmg);floatText(`-${dmg} HP`);updateHud();if(state.hp<=0){const lost=Math.floor(state.gold*.15);state.gold-=lost;state.hp=state.maxHp;player.position.set(0,0,0);toast(`💀 復活！ ${lost}G失った`);updateHud()}save()}}
  if(nearest&&nearD<4){enemyBar.style.display='block';enemyName.textContent='スライム';enemyFill.style.width=`${Math.max(0,nearest.hp/nearest.maxHp*100)}%`}else enemyBar.style.display='none';
  const desired=player.position.clone().add(new THREE.Vector3(0,6.2,8.2).applyAxisAngle(new THREE.Vector3(0,1,0),player.rotation.y));camera.position.lerp(desired,.09);camera.lookAt(player.position.x,1.0,player.position.z);
  renderer.render(scene,camera)
}
requestAnimationFrame(loop);updateHud();toast('3DアクションRPGへようこそ！');

// iPhone Safariで、連打・ダブルタップ・ピンチ操作による意図しない拡大を抑える
['gesturestart','gesturechange','gestureend'].forEach(n=>document.addEventListener(n,e=>e.preventDefault(),{passive:false}));
gameWrap.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
let lastTouchEnd=0;gameWrap.addEventListener('touchend',e=>{const now=Date.now();if(now-lastTouchEnd<350)e.preventDefault();lastTouchEnd=now},{passive:false});
</script>
</body>
</html>
